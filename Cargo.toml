[package]
name = "jog"
version = "0.1.47"
edition = "2024"
license = "MIT"
description = "A terminal UI for git and GitHub Actions across several repos: stage, commit, push, trigger and watch CI."
readme = "README.md"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
octocrab = "0.44"
# The same `http` stack octocrab speaks, for the conditional-request headers
# (`If-None-Match`) its typed API has no slot for — and for naming the body
# type its raw responses carry.
http = "1"
http-body-util = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
toml = "0.9"
async-trait = "0.1"
anyhow = "1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
open = "5"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
notify-rust = "4.18.0"
rayon = "1.12.0"
unicode-width = "0.2"
# Blocking HTTP for the Uptime Kuma status page — two small JSON GETs per
# poll, run off-thread the way git subprocesses are. rustls, no OpenSSL.
ureq = { version = "2", default-features = false, features = ["tls"] }


[profile.release]
opt-level = 3        # speed over size: rendering + parsing are the hot paths
lto = "thin"         # near-fat-LTO wins at a fraction of the build-time cost
codegen-units = 16   # parallel codegen across all cores
panic = "abort"      # removes unwinding machinery
strip = true         # strips symbols (since Rust 1.70+)
